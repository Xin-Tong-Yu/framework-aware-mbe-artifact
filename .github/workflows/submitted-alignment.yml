name: Submitted-paper alignment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify canonical inputs and pinned sources
        run: |
          bash scripts/quickcheck.sh
          python3 scripts/verify_artifact.py --full-scan
          python3 scripts/setup_paper_ablations.py --check-only
      - name: Check paper reference counts and timing validation
        run: python3 -B -m unittest discover -s tests -v
      - name: Check the packaged exact enumerators
        run: |
          python3 runners/MBE_FAIR_MBET_2024.zip selftest --cases 20
          python3 runners/MBE_PURE_ET1_ET2.zip selftest --cases 20 --modes single_st,single_et1,single_et2,double_compact_st,double_compact_et1,double_compact_et2
      - name: Verify Double guidance against exact adjacency
        run: python3 scripts/verify_double_guidance.py
